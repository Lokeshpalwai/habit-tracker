<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HabitTrack – Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
/* ── Reset & Root ────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
:root {
  --blue:        #3b82f6;
  --blue-dark:   #1d4ed8;
  --blue-light:  #dbeafe;
  --blue-xlight: #eff6ff;
  --purple:      #8b5cf6;
  --green:       #10b981;
  --amber:       #f59e0b;
  --red:         #ef4444;
  --g50:  #f8fafc;
  --g100: #f1f5f9;
  --g200: #e2e8f0;
  --g300: #cbd5e1;
  --g400: #94a3b8;
  --g500: #64748b;
  --g700: #334155;
  --g800: #1e293b;
  --g900: #0f172a;
  --font: 'DM Sans', sans-serif;
  --mono: 'DM Mono', monospace;
  --radius: 14px;
  --shadow-card: 0 4px 6px -1px rgba(0,0,0,.07), 0 20px 40px -8px rgba(0,0,0,.12);
  --shadow-btn:  0 2px 8px rgba(59,130,246,.35);
}
 
body {
  font-family: var(--font);
  background: var(--g100);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  position: relative;
  overflow-x: hidden;
}
 
/* ── Animated background dots ────────────────── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    radial-gradient(circle at 20% 20%, rgba(59,130,246,.08) 0%, transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(139,92,246,.06) 0%, transparent 50%),
    radial-gradient(circle at 50% 50%, rgba(16,185,129,.04) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
}
 
/* floating habit icons background */
.bg-icons {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.bg-icon {
  position: absolute;
  font-size: 28px;
  opacity: .07;
  animation: floatUp linear infinite;
  user-select: none;
}
 
@keyframes floatUp {
  0%   { transform: translateY(110vh) rotate(0deg);   opacity: 0; }
  10%  { opacity: .07; }
  90%  { opacity: .07; }
  100% { transform: translateY(-15vh) rotate(360deg); opacity: 0; }
}
 
/* ── Main wrapper ──────────────────────────────── */
.wrapper {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 460px;
}
 
/* ── Logo header ───────────────────────────────── */
.logo-area {
  text-align: center;
  margin-bottom: 28px;
  animation: slideDown .5s ease both;
}
.logo {
  font-size: 28px;
  font-weight: 800;
  color: var(--g900);
  letter-spacing: -1px;
}
.logo em { color: var(--blue); font-style: normal; }
.logo-tagline {
  font-size: 13px;
  color: var(--g500);
  margin-top: 4px;
  font-weight: 400;
}
 
@keyframes slideDown {
  from { opacity: 0; transform: translateY(-16px); }
  to   { opacity: 1; transform: translateY(0); }
}
 
/* ── Card ──────────────────────────────────────── */
.card {
  background: #fff;
  border-radius: var(--radius);
  box-shadow: var(--shadow-card);
  border: 1px solid var(--g200);
  overflow: hidden;
  animation: slideUp .5s ease both;
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}
 
/* ── Tab switcher ──────────────────────────────── */
.tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  border-bottom: 1px solid var(--g200);
}
.tab-btn {
  padding: 16px;
  font-size: 14px;
  font-weight: 600;
  color: var(--g500);
  background: var(--g50);
  border: none;
  cursor: pointer;
  transition: all .2s;
  font-family: var(--font);
  letter-spacing: -.1px;
}
.tab-btn:first-child { border-right: 1px solid var(--g200); }
.tab-btn.active {
  background: #fff;
  color: var(--blue);
  border-bottom: 2px solid var(--blue);
  margin-bottom: -1px;
}
.tab-btn:hover:not(.active) { background: var(--g100); color: var(--g700); }
 
/* ── Form panels ───────────────────────────────── */
.panel { display: none; padding: 32px 32px 28px; }
.panel.active { display: block; }
 
/* ── Avatar area (signup) ──────────────────────── */
.avatar-area {
  display: flex;
  justify-content: center;
  margin-bottom: 24px;
}
.avatar-circle {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: var(--blue-light);
  border: 3px solid var(--blue);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  cursor: pointer;
  position: relative;
  transition: transform .15s;
}
.avatar-circle:hover { transform: scale(1.05); }
.avatar-edit {
  position: absolute;
  bottom: 0; right: 0;
  width: 22px; height: 22px;
  background: var(--blue);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px;
  color: #fff;
}
 
/* ── Form layout ───────────────────────────────── */
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-group { margin-bottom: 18px; }
.form-group:last-of-type { margin-bottom: 0; }
 
label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--g700);
  margin-bottom: 6px;
  letter-spacing: .2px;
  text-transform: uppercase;
}
 
.input-wrap {
  position: relative;
  display: flex;
  align-items: center;
}
.input-icon {
  position: absolute;
  left: 12px;
  font-size: 16px;
  pointer-events: none;
  z-index: 1;
}
input[type="text"],
input[type="email"],
input[type="password"] {
  width: 100%;
  padding: 11px 12px 11px 40px;
  border-radius: 10px;
  border: 1.5px solid var(--g200);
  font-size: 14px;
  font-family: var(--font);
  color: var(--g900);
  background: var(--g50);
  transition: border-color .15s, background .15s, box-shadow .15s;
  outline: none;
}
input::placeholder { color: var(--g400); }
input:focus {
  border-color: var(--blue);
  background: #fff;
  box-shadow: 0 0 0 3px rgba(59,130,246,.12);
}
input.error { border-color: var(--red); box-shadow: 0 0 0 3px rgba(239,68,68,.1); }
input.success { border-color: var(--green); box-shadow: 0 0 0 3px rgba(16,185,129,.1); }
 
.eye-toggle {
  position: absolute;
  right: 12px;
  background: none;
  border: none;
  cursor: pointer;
  font-size: 16px;
  color: var(--g400);
  padding: 0;
  z-index: 1;
  transition: color .15s;
}
.eye-toggle:hover { color: var(--g700); }
 
/* ── Password strength ─────────────────────────── */
.strength-bar {
  display: flex;
  gap: 4px;
  margin-top: 8px;
}
.strength-seg {
  flex: 1;
  height: 3px;
  border-radius: 99px;
  background: var(--g200);
  transition: background .3s;
}
.strength-label {
  font-size: 11px;
  margin-top: 4px;
  font-weight: 600;
  height: 14px;
}
 
/* ── Checkbox ──────────────────────────────────── */
.checkbox-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin: 18px 0;
  cursor: pointer;
}
.checkbox-row input[type="checkbox"] {
  width: 16px; height: 16px;
  flex-shrink: 0;
  accent-color: var(--blue);
  margin-top: 1px;
  cursor: pointer;
  padding: 0;
  border-radius: 4px;
}
.checkbox-row span {
  font-size: 12px;
  color: var(--g500);
  line-height: 1.5;
}
.checkbox-row a { color: var(--blue); text-decoration: none; font-weight: 600; }
.checkbox-row a:hover { text-decoration: underline; }
 
/* ── Remember & forgot ─────────────────────────── */
.login-extras {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 14px 0 20px;
}
.forgot-link {
  font-size: 12px;
  color: var(--blue);
  text-decoration: none;
  font-weight: 600;
}
.forgot-link:hover { text-decoration: underline; }
 
/* ── Submit button ─────────────────────────────── */
.submit-btn {
  width: 100%;
  padding: 13px;
  border-radius: 10px;
  border: none;
  background: linear-gradient(135deg, var(--blue) 0%, #6366f1 100%);
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  font-family: var(--font);
  cursor: pointer;
  transition: opacity .15s, transform .1s, box-shadow .15s;
  letter-spacing: -.2px;
  box-shadow: var(--shadow-btn);
  position: relative;
  overflow: hidden;
}
.submit-btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,.15) 0%, transparent 50%);
  pointer-events: none;
}
.submit-btn:hover { opacity: .92; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(59,130,246,.45); }
.submit-btn:active { transform: translateY(0); }
.submit-btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }
 
/* ── Divider ───────────────────────────────────── */
.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 22px 0;
  color: var(--g400);
  font-size: 12px;
  font-weight: 500;
}
.divider::before, .divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--g200);
}
 
/* ── Social buttons ────────────────────────────── */
.social-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.social-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px;
  border-radius: 10px;
  border: 1.5px solid var(--g200);
  background: #fff;
  font-size: 13px;
  font-weight: 600;
  color: var(--g700);
  font-family: var(--font);
  cursor: pointer;
  transition: all .15s;
}
.social-btn:hover { background: var(--g50); border-color: var(--g300); }
.social-icon { font-size: 18px; }
 
/* ── Error / success messages ──────────────────── */
.field-msg {
  font-size: 11px;
  margin-top: 5px;
  font-weight: 500;
  min-height: 14px;
  display: flex;
  align-items: center;
  gap: 4px;
}
.field-msg.err { color: var(--red); }
.field-msg.ok  { color: var(--green); }
 
/* ── Alert toast ───────────────────────────────── */
.toast {
  position: fixed;
  top: 20px;
  right: 20px;
  padding: 12px 18px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  z-index: 1000;
  opacity: 0;
  transform: translateX(20px);
  transition: all .3s;
  pointer-events: none;
  max-width: 320px;
}
.toast.show { opacity: 1; transform: translateX(0); }
.toast.success { background: var(--green); color: #fff; }
.toast.error   { background: var(--red);   color: #fff; }
.toast.info    { background: var(--blue);  color: #fff; }
 
/* ── Spinner ───────────────────────────────────── */
.spinner {
  display: inline-block;
  width: 16px; height: 16px;
  border: 2px solid rgba(255,255,255,.4);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .6s linear infinite;
  vertical-align: middle;
  margin-right: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }
 
/* ── Footer ────────────────────────────────────── */
.card-footer {
  padding: 14px 32px 18px;
  text-align: center;
  border-top: 1px solid var(--g100);
  font-size: 12px;
  color: var(--g500);
}
.card-footer a { color: var(--blue); text-decoration: none; font-weight: 600; }
.card-footer a:hover { text-decoration: underline; }
 
/* ── Stats row (under card) ────────────────────── */
.stats-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
  margin-top: 20px;
  animation: slideUp .6s ease .1s both;
}
.stat-card {
  background: #fff;
  border-radius: 12px;
  padding: 14px 12px;
  text-align: center;
  border: 1px solid var(--g200);
  box-shadow: 0 1px 3px rgba(0,0,0,.06);
}
.stat-num { font-size: 20px; font-weight: 800; color: var(--g900); }
.stat-lbl { font-size: 10px; color: var(--g500); margin-top: 2px; font-weight: 500; text-transform: uppercase; letter-spacing: .3px; }
 
/* ── Profile avatar selector ───────────────────── */
.emoji-picker {
  display: none;
  flex-wrap: wrap;
  gap: 6px;
  justify-content: center;
  margin-top: 10px;
  padding: 12px;
  background: var(--g50);
  border-radius: 12px;
  border: 1px solid var(--g200);
  max-height: 130px;
  overflow-y: auto;
}
.emoji-picker.open { display: flex; }
.ep-opt {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  border-radius: 8px;
  cursor: pointer;
  transition: background .12s;
  border: 1.5px solid transparent;
}
.ep-opt:hover { background: var(--g200); }
.ep-opt.sel { border-color: var(--blue); background: var(--blue-light); }
 
/* ── Responsive ────────────────────────────────── */
@media(max-width:480px) {
  .panel { padding: 24px 20px 20px; }
  .form-row { grid-template-columns: 1fr; }
  .social-row { grid-template-columns: 1fr; }
  .stats-row { grid-template-columns: 1fr; }
  .card-footer { padding: 12px 20px 16px; }
}
</style>
</head>
<body>
 
<!-- Floating background icons -->
<div class="bg-icons" id="bgIcons"></div>
 
<!-- Toast notification -->
<div class="toast" id="toast"></div>
 
<div class="wrapper">
 
  <!-- Logo -->
  <div class="logo-area">
    <div class="logo">Habit<em>Track</em></div>
    <div class="logo-tagline">Your personal daily habit dashboard</div>
  </div>
 
  <!-- Auth Card -->
  <div class="card">
 
    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('login')" id="tab-login">Sign In</button>
      <button class="tab-btn" onclick="switchTab('signup')" id="tab-signup">Create Account</button>
    </div>
 
    <!-- ═══════════════════════════════════════════════ -->
    <!-- LOGIN PANEL                                     -->
    <!-- ═══════════════════════════════════════════════ -->
    <div class="panel active" id="panel-login">
 
      <!-- Social sign-in -->
      <div class="social-row">
        <button class="social-btn" onclick="socialLogin('Google')">
          <span class="social-icon">🌐</span> Google
        </button>
        <button class="social-btn" onclick="socialLogin('GitHub')">
          <span class="social-icon">🐙</span> GitHub
        </button>
      </div>
 
      <div class="divider">or sign in with email</div>
 
      <!-- Email -->
      <div class="form-group">
        <label>Email address</label>
        <div class="input-wrap">
          <span class="input-icon">✉️</span>
          <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email" oninput="clearErr('login-email')"/>
        </div>
        <div class="field-msg err" id="login-email-msg"></div>
      </div>
 
      <!-- Password -->
      <div class="form-group">
        <label>Password</label>
        <div class="input-wrap">
          <span class="input-icon">🔒</span>
          <input type="password" id="login-pass" placeholder="Enter your password" autocomplete="current-password" oninput="clearErr('login-pass')" onkeydown="if(event.key==='Enter')doLogin()"/>
          <button class="eye-toggle" onclick="toggleEye('login-pass',this)" type="button">👁️</button>
        </div>
        <div class="field-msg err" id="login-pass-msg"></div>
      </div>
 
      <!-- Remember + Forgot -->
      <div class="login-extras">
        <label class="checkbox-row" style="margin:0;gap:8px">
          <input type="checkbox" id="remember-me"/>
          <span style="font-size:12px;color:var(--g500)">Remember me</span>
        </label>
        <a href="#" class="forgot-link" onclick="showForgot();return false;">Forgot password?</a>
      </div>
 
      <button class="submit-btn" onclick="doLogin()" id="login-btn">Sign In to HabitTrack</button>
 
    </div>
 
    <!-- ═══════════════════════════════════════════════ -->
    <!-- SIGNUP PANEL                                    -->
    <!-- ═══════════════════════════════════════════════ -->
    <div class="panel" id="panel-signup">
 
      <!-- Avatar picker -->
      <div class="avatar-area">
        <div class="avatar-circle" onclick="togglePicker()" id="avatarCircle" title="Choose avatar">
          <span id="avatarEmoji">😊</span>
          <div class="avatar-edit">✏️</div>
        </div>
      </div>
      <div class="emoji-picker" id="emojiPicker"></div>
 
      <!-- Name row -->
      <div class="form-row" style="margin-bottom:18px">
        <div class="form-group" style="margin-bottom:0">
          <label>First name</label>
          <div class="input-wrap">
            <span class="input-icon">👤</span>
            <input type="text" id="su-fname" placeholder="Priya" autocomplete="given-name" oninput="clearErr('su-fname')"/>
          </div>
          <div class="field-msg err" id="su-fname-msg"></div>
        </div>
        <div class="form-group" style="margin-bottom:0">
          <label>Last name</label>
          <div class="input-wrap">
            <span class="input-icon">👤</span>
            <input type="text" id="su-lname" placeholder="Sharma" autocomplete="family-name" oninput="clearErr('su-lname')"/>
          </div>
          <div class="field-msg err" id="su-lname-msg"></div>
        </div>
      </div>
 
      <!-- Email -->
      <div class="form-group">
        <label>Email address</label>
        <div class="input-wrap">
          <span class="input-icon">✉️</span>
          <input type="email" id="su-email" placeholder="you@example.com" autocomplete="email" oninput="validateEmail()"/>
        </div>
        <div class="field-msg" id="su-email-msg"></div>
      </div>
 
      <!-- Password -->
      <div class="form-group">
        <label>Password</label>
        <div class="input-wrap">
          <span class="input-icon">🔒</span>
          <input type="password" id="su-pass" placeholder="Min 8 characters" autocomplete="new-password" oninput="checkStrength()"/>
          <button class="eye-toggle" onclick="toggleEye('su-pass',this)" type="button">👁️</button>
        </div>
        <div class="strength-bar">
          <div class="strength-seg" id="seg1"></div>
          <div class="strength-seg" id="seg2"></div>
          <div class="strength-seg" id="seg3"></div>
          <div class="strength-seg" id="seg4"></div>
        </div>
        <div class="strength-label" id="strength-label" style="color:var(--g400);font-size:11px;margin-top:4px"></div>
        <div class="field-msg err" id="su-pass-msg"></div>
      </div>
 
      <!-- Confirm password -->
      <div class="form-group">
        <label>Confirm password</label>
        <div class="input-wrap">
          <span class="input-icon">🔒</span>
          <input type="password" id="su-confirm" placeholder="Re-enter password" autocomplete="new-password" oninput="checkConfirm()"/>
          <button class="eye-toggle" onclick="toggleEye('su-confirm',this)" type="button">👁️</button>
        </div>
        <div class="field-msg" id="su-confirm-msg"></div>
      </div>
 
      <!-- Terms -->
      <label class="checkbox-row">
        <input type="checkbox" id="agree-terms"/>
        <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>. My habit data stays private and stored locally.</span>
      </label>
 
      <button class="submit-btn" onclick="doSignup()" id="signup-btn">Create My Account 🚀</button>
 
    </div>
 
    <!-- Card footer -->
    <div class="card-footer" id="card-footer-login">
      Don't have an account? <a href="#" onclick="switchTab('signup');return false;">Create one free →</a>
    </div>
 
  </div>
 
  <!-- Stats teaser below card -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-num" style="color:var(--blue)">15</div>
      <div class="stat-lbl">Habits tracked</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" style="color:var(--green)">100%</div>
      <div class="stat-lbl">Free forever</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" style="color:var(--amber)">∞</div>
      <div class="stat-lbl">Daily streaks</div>
    </div>
  </div>
 
</div>
 
<script>
// ──────────────────────────────────────────────
// DATA STORE (localStorage — no backend needed)
// ──────────────────────────────────────────────
const USERS_KEY = 'ht_users_v1';
const SESSION_KEY = 'ht_session_v1';
const DASHBOARD_URL = 'dashboard.html';
 
function getUsers() {
  try { return JSON.parse(localStorage.getItem(USERS_KEY)) || []; }
  catch { return []; }
}
function saveUsers(u) { localStorage.setItem(USERS_KEY, JSON.stringify(u)); }
function getSession() {
  try { return JSON.parse(localStorage.getItem(SESSION_KEY)); }
  catch { return null; }
}
function setSession(user) { localStorage.setItem(SESSION_KEY, JSON.stringify(user)); }
 
// Auto-redirect if already logged in
(function() {
  const session = getSession();
  if (session && session.email) {
    showToast(`Welcome back, ${session.firstName}! Redirecting...`, 'success');
    window.location.href = DASHBOARD_URL;
  }
})();
 
// Auto-fill remembered email
(function() {
  const rem = localStorage.getItem('ht_remember');
  if (rem) {
    document.getElementById('login-email').value = rem;
    document.getElementById('remember-me').checked = true;
  }
})();
 
// ──────────────────────────────────────────────
// BACKGROUND FLOATING ICONS
// ──────────────────────────────────────────────
const ICONS = ['💧','🏃','📚','🧘','✏️','😴','🥗','📓','👟','🙏','🎯','💰','💪','🌿','☕'];
(function spawnIcons() {
  const container = document.getElementById('bgIcons');
  ICONS.forEach((icon, i) => {
    const el = document.createElement('div');
    el.className = 'bg-icon';
    el.textContent = icon;
    el.style.left = (Math.random() * 100) + 'vw';
    el.style.animationDuration = (15 + Math.random() * 20) + 's';
    el.style.animationDelay = (Math.random() * -20) + 's';
    el.style.fontSize = (20 + Math.random() * 16) + 'px';
    container.appendChild(el);
  });
})();
 
// ──────────────────────────────────────────────
// TAB SWITCHING
// ──────────────────────────────────────────────
function switchTab(tab) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-' + tab).classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
  // update footer
  const footer = document.getElementById('card-footer-login');
  if (tab === 'login') {
    footer.innerHTML = 'Don\'t have an account? <a href="#" onclick="switchTab(\'signup\');return false;">Create one free →</a>';
  } else {
    footer.innerHTML = 'Already have an account? <a href="#" onclick="switchTab(\'login\');return false;">Sign in →</a>';
  }
}
 
// ──────────────────────────────────────────────
// EYE TOGGLE (show/hide password)
// ──────────────────────────────────────────────
function toggleEye(inputId, btn) {
  const inp = document.getElementById(inputId);
  if (inp.type === 'password') {
    inp.type = 'text';
    btn.textContent = '🙈';
  } else {
    inp.type = 'password';
    btn.textContent = '👁️';
  }
}
 
// ──────────────────────────────────────────────
// VALIDATION HELPERS
// ──────────────────────────────────────────────
function setErr(id, msg) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = '⚠ ' + msg;
  el.className = 'field-msg err';
  const inp = document.getElementById(id.replace('-msg',''));
  if (inp) inp.classList.add('error');
}
function setOk(id, msg) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = msg ? '✓ ' + msg : '';
  el.className = 'field-msg ok';
  const inp = document.getElementById(id.replace('-msg',''));
  if (inp) { inp.classList.remove('error'); inp.classList.add('success'); }
}
function clearErr(id) {
  const msg = document.getElementById(id + '-msg');
  if (msg) { msg.textContent = ''; msg.className = 'field-msg'; }
  const inp = document.getElementById(id);
  if (inp) { inp.classList.remove('error','success'); }
}
 
function validateEmail() {
  const v = document.getElementById('su-email').value.trim();
  const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!v) { clearErr('su-email'); return false; }
  if (!re.test(v)) { setErr('su-email-msg', 'Enter a valid email address'); return false; }
  const users = getUsers();
  if (users.find(u => u.email === v)) { setErr('su-email-msg', 'This email is already registered'); return false; }
  setOk('su-email-msg', 'Looks good!');
  return true;
}
 
// ──────────────────────────────────────────────
// PASSWORD STRENGTH
// ──────────────────────────────────────────────
function checkStrength() {
  const val = document.getElementById('su-pass').value;
  const segs = [document.getElementById('seg1'), document.getElementById('seg2'), document.getElementById('seg3'), document.getElementById('seg4')];
  const label = document.getElementById('strength-label');
  segs.forEach(s => s.style.background = 'var(--g200)');
 
  if (!val) { label.textContent = ''; return; }
 
  let score = 0;
  if (val.length >= 8)  score++;
  if (/[A-Z]/.test(val)) score++;
  if (/[0-9]/.test(val)) score++;
  if (/[^A-Za-z0-9]/.test(val)) score++;
 
  const colors = ['', '#ef4444', '#f59e0b', '#3b82f6', '#10b981'];
  const labels = ['', 'Weak', 'Fair', 'Good', 'Strong 💪'];
  for (let i = 0; i < score; i++) segs[i].style.background = colors[score];
  label.textContent = labels[score];
  label.style.color = colors[score];
  clearErr('su-pass');
}
 
function checkConfirm() {
  const p = document.getElementById('su-pass').value;
  const c = document.getElementById('su-confirm').value;
  if (!c) { clearErr('su-confirm'); return; }
  if (p === c) setOk('su-confirm-msg', 'Passwords match!');
  else setErr('su-confirm-msg', 'Passwords do not match');
}
 
// ──────────────────────────────────────────────
// EMOJI AVATAR PICKER
// ──────────────────────────────────────────────
const AVATARS = ['😊','😎','🦁','🐯','🦊','🐼','🦋','🌟','🔥','⚡','🎯','💡','🚀','🌈','🎸','🏆','💎','🌸','🍀','🦅'];
let selectedAvatar = '😊';
 
(function buildPicker() {
  const p = document.getElementById('emojiPicker');
  AVATARS.forEach(e => {
    const d = document.createElement('div');
    d.className = 'ep-opt' + (e === selectedAvatar ? ' sel' : '');
    d.textContent = e;
    d.onclick = () => {
      selectedAvatar = e;
      document.getElementById('avatarEmoji').textContent = e;
      document.querySelectorAll('.ep-opt').forEach(x => x.classList.remove('sel'));
      d.classList.add('sel');
    };
    p.appendChild(d);
  });
})();
 
function togglePicker() {
  document.getElementById('emojiPicker').classList.toggle('open');
}
 
// ──────────────────────────────────────────────
// TOAST
// ──────────────────────────────────────────────
let toastTimer;
function showToast(msg, type = 'info') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + type + ' show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
}
 
// ──────────────────────────────────────────────
// SOCIAL LOGIN (demo — shows info)
// ──────────────────────────────────────────────
function socialLogin(provider) {
  showToast(`${provider} login: Connect a backend to enable this.`, 'info');
}
 
// ──────────────────────────────────────────────
// FORGOT PASSWORD
// ──────────────────────────────────────────────
function showForgot() {
  const email = document.getElementById('login-email').value.trim();
  if (!email) {
    showToast('Enter your email first, then click Forgot Password.', 'info');
    document.getElementById('login-email').focus();
    return;
  }
  const users = getUsers();
  const user = users.find(u => u.email === email);
  if (!user) {
    showToast('No account found with that email.', 'error');
    return;
  }
  showToast(`Password reset link sent to ${email}! (Demo mode: check your local storage)`, 'success');
}
 
// ──────────────────────────────────────────────
// LOGIN
// ──────────────────────────────────────────────
function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value.trim();

  if (!email || !pass) {
    alert("Please fill all fields");
    return;
  }

  const btn = document.getElementById('login-btn');
  btn.innerHTML = "Signing in...";
  btn.disabled = true;

  // Simulate instant login (no delay)
  const user = { email: email, name: email };

  localStorage.setItem('ht_session_v1', JSON.stringify({
    loggedIn: true,
    email: email,
    name: email
  }));

  // 🔥 IMPORTANT: Immediate redirect
  window.location.href = "dashboard.html";
}
 
// ──────────────────────────────────────────────
// SIGN UP
// ──────────────────────────────────────────────
function doSignup() {
  const email = document.getElementById('su-email').value.trim();

  if (!email) {
    alert("Enter email");
    return;
  }

  localStorage.setItem('ht_session_v1', JSON.stringify({
    loggedIn: true,
    email: email,
    name: email
  }));

  window.location.href = "dashboard.html";
}
 
// Enter key on login pass
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const activePanel = document.querySelector('.panel.active').id;
    if (activePanel === 'panel-login') doLogin();
    else doSignup();
  }
});
</script>
